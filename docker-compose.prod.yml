# Production overrides — use with:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      RUN_MIGRATIONS: "true"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - storage:/var/www/html/storage/app:ro

  postgres:
    restart: always
    ports: []   # Don't expose DB publicly in production

  redis:
    restart: always
    ports: []   # Don't expose Redis publicly in production

  queue:
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=256 --queue=default,bulk,notifications
    deploy:
      replicas: 2

  scheduler:
    restart: always
